'大会・参加者・Stage・Attempt・写真・Revisionを端末内で管理します。':'Manage matches, shooters, stages, attempts, photos, and revisions locally on this device.',

'全体順位':'Overall ranking','Complete shooterなし':'No completed shooters','端末内の通常保存はIndexedDB。ここから大会単位のZIPを別ファイルとして保存できます。':'Normal local storage uses IndexedDB. You can export each match as a separate ZIP backup.',
'ZIP構造: ':'ZIP structure: ','iPhone/Safari等では、ブラウザの制限により任意フォルダへ自動追記せず、ZIPとしてFilesへ保存する方式です。':'On iPhone/Safari, browser restrictions prevent automatic writes to arbitrary folders, so backups are exported as ZIP files to Files.',
'ZIPを作成中…':'Creating ZIP…','Backup ZIPを作成しました':'Backup ZIP created.','Local-first HTML prototype。通常データと写真はブラウザのIndexedDBに保存します。':'Local-first HTML prototype. Normal data and photos are stored in the browser\'s IndexedDB.','標準計算':'Standard Calculation','注意':'Note','複数Attempt（Best/First/Last/Average/Manual）はこのアプリ独自の大会運用機能です。正式なUSPSA Matchで使用する場合は、そのMatchのWritten Stage Briefingと現行ルールを優先してください。':'Multiple attempts (Best/First/Last/Average/Manual) are a custom match-management feature of this app. For an official USPSA match, the Written Stage Briefing and current rules take precedence.','IndexedDBを使用できません。Safari/Chromeの通常タブで開いてください。':'IndexedDB is unavailable. Open this file in a normal Safari/Chrome tab.','ルール変更の確認':'Confirm Rule Change','変更を許可':'Allow Change','キャンセル':'Cancel','Scoring Ruleを変更しました':'Scoring Rule changed.','Matchを開いてから変更してください':'Open a match before changing the scoring rule.','確認して変更':'Review & Change','Zone追加':'Add Zone','ルール変更により、保存済みのスコア換算、Hit Factor、Stage Points、順位が異なる結果になる可能性があります。変更を許可しますか？':'Changing the rule may recalculate saved scores, Hit Factor, Stage Points, and rankings. Allow this change?'
};
const I18N_JA={
'Match':'大会','Shooters':'参加者','Shooter':'参加者','Stages':'ステージ','Stage results':'ステージ結果','Current complete leader':'暫定首位','Provisional Ranking':'暫定ランキング','No commonly completed stages':'全員完了Stageなし','All shooters completed':'全参加者完了','Counted stages':'集計対象','Details':'詳細','Live Results':'ライブ結果','Results':'結果','Backup':'バックアップ','Backup / Export':'バックアップ / 出力','New Match':'新規大会','Overall':'総合','In progress':'進行中','Stage statistics':'ステージ統計','Rank / Shooter':'順位 / 参加者','Progress':'進捗','Points':'ポイント','Current pts':'現在ポイント','Scored':'採点済み','Max HF':'最高HF','Avg HF':'平均HF','Median HF':'中央値HF','Official result':'正式結果','Revision History':'修正履歴','CURRENT':'現在','COMPLETE':'完了','IN PROGRESS':'進行中','Time':'タイム','Notes':'メモ','Photo':'写真','Photos':'写真','Camera':'カメラ','Attempt':'試行','Attempts':'試行回数','Valid':'有効','VOID':'無効','Manual':'手動','Rule':'方式','Status':'状態','Stage Points':'ステージポイント','Stage Rank':'ステージ順位','Average HF':'平均HF','Highest HF':'最高HF','Complete':'完了','Not Started':'未実施','Edit':'編集','Delete':'削除','Save':'保存','Close':'閉じる','Name':'名前','Date':'日付','Competition / Match Name':'競技名 / 大会名','Number of Stages':'ステージ数','Create':'作成','Match Settings':'大会設定'
};
function translateTextValue(text,lang){
 if(!text)return text;
 if(lang==='en'){
  let out=text;
  const keys=Object.keys(I18N_EN).sort((a,b)=>b.length-a.length);
  for(const k of keys) out=out.split(k).join(I18N_EN[k]);
  out=out.replace(/(\d+)枚保存しました/g,'$1 photo(s) saved');
  out=out.replace(/v(\d+)をv(\d+)として復元/g,'Restored v$1 as v$2');
  return out;
 }
 let out=text;
 const keys=Object.keys(I18N_JA).sort((a,b)=>b.length-a.length);
 for(const k of keys){ if(out.trim()===k) out=out.replace(k,I18N_JA[k]); }
 return out;
}
function applyLanguage(root=document){
 const lang=state.language||'ja'; document.documentElement.lang=lang;
 const sel=document.getElementById('langSelect'); if(sel&&sel.value!==lang)sel.value=lang;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
 for(const n of nodes){const p=n.parentElement;if(!p||['SCRIPT','STYLE','OPTION'].includes(p.tagName))continue;n.nodeValue=translateTextValue(n.nodeValue,lang)}
 if(root.querySelectorAll){root.querySelectorAll('input[placeholder]').forEach(el=>{el.placeholder=translateTextValue(el.placeholder,lang)});root.querySelectorAll('option').forEach(el=>{if(el.value!=='ja'&&el.value!=='en')el.textContent=translateTextValue(el.textContent,lang)})}
}
async function setLanguage(lang){state.language=lang==='en'?'en':'ja';await save();render();applyLanguage(document)}

function toast(msg){const t=$('#toast');t.textContent=translateTextValue(msg,state.language||'ja');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('uspsa_match_scorer',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function idbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly'),r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbPut(store,val,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite'),s=tx.objectStore(store),r=key!==undefined?s.put(val,key):s.put(val);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbDel(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite'),r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function save(){await idbPut('kv',state,'state')}
function match(){return state.matches.find(m=>m.id===state.activeMatchId)||null}
function scoreKey(sh,st){return sh+'|'+st}
function getScore(m,sh,st){m.scores=m.scores||{};return m.scores[scoreKey(sh,st)]||null}
function ensureScore(m,sh,st){m.scores=m.scores||{};const k=scoreKey(sh,st);if(!m.scores[k])m.scores[k]={attempts:[],officialAttemptId:null};return m.scores[k]}
function latestVersion(at){return at?.versions?.[at.versions.length-1]||null}
function defaultRuleProfile(type='USPSA'){
 if(type==='PCSL')return {type:'PCSL',name:'PCSL',zones:[{key:'T',label:'T / K',minor:10,major:10},{key:'A',label:'A',minor:5,major:5},{key:'C',label:'C',minor:3,major:3},{key:'D',label:'D',minor:1,major:1}],miss:10,noShoot:10,procedural:10,usePF:false};
 if(type==='CUSTOM')return {type:'CUSTOM',name:'Custom',zones:[{key:'HA',label:'H A',minor:10,major:10},{key:'HB',label:'H B',minor:5,major:5},{key:'A',label:'A',minor:5,major:5},{key:'C',label:'C',minor:3,major:4},{key:'D',label:'D',minor:1,major:2}],miss:10,noShoot:10,procedural:10,usePF:true};
 return {type:'USPSA',name:'USPSA',zones:[{key:'A',label:'A',minor:5,major:5},{key:'C',label:'C',minor:3,major:4},{key:'D',label:'D',minor:1,major:2}],miss:10,noShoot:10,procedural:10,usePF:true};
}
function getRule(m=match()){if(!m)return defaultRuleProfile('USPSA');if(!m.ruleProfile)m.ruleProfile=defaultRuleProfile('USPSA');return m.ruleProfile}
function zoneCount(v,key){if(v?.zones&&v.zones[key]!=null)return +v.zones[key]||0;const legacy={A:'a',C:'c',D:'d'}[key];return legacy?+v?.[legacy]||0:0}
function calcVersion(v,pf='Minor',m=match()){
 if(!v)return null; const rule=getRule(m),M=+v.m||0,NS=+v.ns||0,PR=+v.proc||0,custom=+v.custom||0,time=+v.time||0;
 let raw=0;for(const z of rule.zones||[]){const pts=(rule.usePF&&pf==='Major')?(+z.major||0):(+z.minor||0);raw+=zoneCount(v,z.key)*pts}
 const penalties=M*(+rule.miss||0)+NS*(+rule.noShoot||0)+PR*(+rule.procedural||0)+custom; const total=raw-penalties; const countable=Math.max(0,total); const hf=time>0?countable/time:0;
 return {raw,penalties,total,countable,hf,time};
}
function officialAttempt(m,shooter,stage){
 const sc=getScore(m,shooter.id,stage.id);if(!sc||!sc.attempts.length)return null;
 const valid=sc.attempts.filter(a=>a.status!=='VOID'&&latestVersion(a)); if(!valid.length)return null;
 if(stage.rule==='first') return valid[0];
 if(stage.rule==='last') return valid[valid.length-1];
 if(stage.rule==='manual') return valid.find(a=>a.id===sc.officialAttemptId)||valid[0];
 if(stage.rule==='average') return {id:'average',average:true,attempts:valid};
 return valid.slice().sort((a,b)=>calcVersion(latestVersion(b),shooter.pf).hf-calcVersion(latestVersion(a),shooter.pf).hf)[0];
}
function officialResult(m,shooter,stage){
 const at=officialAttempt(m,shooter,stage); if(!at)return null;
 if(at.average){const arr=at.attempts.map(a=>calcVersion(latestVersion(a),shooter.pf));const hf=arr.reduce((s,x)=>s+x.hf,0)/arr.length;return {hf,raw:null,penalties:null,total:null,time:null,attempt:at};}
 return {...calcVersion(latestVersion(at),shooter.pf),attempt:at};
}
function stageStats(m,stage,division=null){const rows=m.shooters.filter(s=>!division||s.division===division).map(s=>({s,r:officialResult(m,s,stage)})).filter(x=>x.r);const h=rows.map(x=>x.r.hf).filter(Number.isFinite);const max=h.length?Math.max(...h):0;const avg=h.length?h.reduce((a,b)=>a+b,0)/h.length:0;const sorted=[...h].sort((a,b)=>a-b);const med=!sorted.length?0:sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;return {rows,max,avg,med,count:h.length}}
function stagePoints(m,shooter,stage){const r=officialResult(m,shooter,stage);if(!r)return null;const stats=stageStats(m,stage,shooter.division||'Open');const max=stats.max||0;return max>0?(r.hf/max)*(+stage.maxPoints||0):0}
function overallRows(m){return m.shooters.map(s=>{let pts=0,done=0;for(const st of m.stages){const p=stagePoints(m,s,st);if(p!==null){pts+=p;done++}}return {s,pts,done,total:m.stages.length}}).sort((a,b)=>b.pts-a.pts)}
function commonCompletedStages(m){const out=[];if(!m.shooters.length)return out;for(const st of m.stages){if(!m.shooters.every(s=>!!officialResult(m,s,st)))break;out.push(st)}return out}
function provisionalRows(m){const stages=commonCompletedStages(m);const rows=m.shooters.map(s=>{let pts=0;for(const st of stages){const p=stagePoints(m,s,st);if(p!==null)pts+=p}return {s,pts}}).sort((a,b)=>b.pts-a.pts||a.s.name.localeCompare(b.s.name));return {stages,rows}}

ones||[]).map(z=>'eZ_'+z.key)].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>updateLiveCalc(s.pf)));updateLiveCalc(s.pf);if(a)renderPhotos(a)}
function scoreBox(l,id,val){return `<div class="scorebox"><div class="lab">${esc(l)}</div><div class="controls"><button onclick="stepInput('${id}',-1,0,999)">−</button><input id="${id}" type="number" min="0" value="${val||0}"><button onclick="stepInput('${id}',1,0,999)">＋</button></div></div>`}

async function saveAttempt(shId,stId,atId){const m=match(),s=m.shooters.find(x=>x.id===shId),st=m.stages.find(x=>x.id===stId),sc=ensureScore(m,shId,stId);let a=atId?sc.attempts.find(x=>x.id===atId):null;if(!a){if(sc.attempts.length>=st.attempts)return toast('最大Attempt数です');a={id:uid('attempt'),versions:[],photoIds:[],status:'VALID'};sc.attempts.push(a)}const prev=latestVersion(a),entry=currentEntryVersion();const v={v:(prev?.v||0)+1,createdAt:new Date().toISOString(),...entry,notes:$('#eNotes').value};v.a=v.zones.A||0;v.c=v.zones.C||0;v.d=v.zones.D||0;a.versions.push(v);if(st.rule==='manual'&&!sc.officialAttemptId)sc.officialAttemptId=a.id;await save();closeModal();render();toast(`Attempt保存 v${v.v}`)}

$('#cameraInput').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;const {sh,st,at}=e.target.dataset,m=match(),s=m.shooters.find(x=>x.id===sh),stage=m.stages.find(x=>x.id===st),sc=ensureScore(m,sh,st),a=sc.attempts.find(x=>x.id===at);for(const f of files){const n=(a.photoIds?.length||0)+1;const id=uid('photo');const name=`${safeName(m.date+'_'+m.name)}_${safeName(s.name)}_${safeName(stage.name)}_Attempt${String(sc.attempts.indexOf(a)+1).padStart(2,'0')}_${String(n).padStart(3,'0')}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;await idbPut('photos',{id,matchId:m.id,shooterId:sh,stageId:st,attemptId:at,name,blob:f,createdAt:new Date().toISOString()});a.photoIds=a.photoIds||[];a.photoIds.push(id)}await save();toast(`${files.length}枚保存しました`);renderPhotos(a)})
async function renderPhotos(a){const el=$('#photoArea');if(!el)return;const items=[];for(const id of a.photoIds||[]){const p=await idbGet('photos',id);if(p)items.push(p)}el.innerHTML=`<div class="photoGrid" style="margin-top:10px">${items.map(p=>`<div class="photo"><img src="${URL.createObjectURL(p.blob)}"><button class="del" onclick="deletePhoto('${a.id}','${p.id}')">×</button><div class="cap">${esc(p.name)}</div></div>`).join('')}</div>`}
async function deletePhoto(atId,pid){if(!confirm('写真を削除しますか？'))return;const m=match();for(const sc of Object.values(m.scores||{})){const a=sc.attempts.find(x=>x.id===atId);if(a){a.photoIds=(a.photoIds||[]).filter(x=>x!==pid);break}}await idbDel('photos',pid);await save();const a=Object.values(m.scores||{}).flatMap(x=>x.attempts).find(x=>x.id===atId);if(a)renderPhotos(a)}
function revisionModal(sh,st,at){const m=match(),s=m.shooters.find(x=>x.id===sh),a=ensureScore(m,sh,st).attempts.find(x=>x.id===at),rule=getRule(m);showModal(`<div class="sheethead"><h3>Revision History</h3><button class="btn small" onclick="closeModal()">閉じる</button></div><div class="sub">${esc(s.name)} · v1 → v${a.versions.length}</div><div class="list" style="margin-top:10px">${[...a.versions].reverse().map(v=>{const r=calcVersion(v,s.pf,m),zs=(rule.zones||[]).map(z=>`${esc(z.label)}${zoneCount(v,z.key)}`).join(' ');return `<div class="row"><div class="main"><div class="title">v${v.v} ${v===latestVersion(a)?'<span class="badge ok">CURRENT</span>':''}</div><div class="meta">${new Date(v.createdAt).toLocaleString()} · Time ${v.time}s · ${zs} M${v.m||0} NS${v.ns||0} PR${v.proc||0} · HF ${fmt(r.hf)}</div></div>${v!==latestVersion(a)?`<button class="btn small" onclick="restoreRevision('${sh}','${st}','${at}',${v.v})">復元</button>`:''}</div>`}).join('')}</div>`)}
async function restoreRevision(sh,st,at,vn){const a=ensureScore(match(),sh,st).attempts.find(x=>x.id===at),src=a.versions.find(v=>v.v===vn),nv={...src,v:(latestVersion(a).v+1),createdAt:new Date().toISOString(),notes:(src.notes||'')+` [restored from v${vn}]`};a.versions.push(nv);await save();closeModal();render();toast(`v${vn}をv${nv.v}として復元`) }
function renderResults(){const m=match(),rows=overallRows(m),pr=provisionalRows(m),prLabel=provisionalStageLabel(pr.stages);const complete=rows.filter(x=>x.done===x.total),progress=rows.filter(x=>x.done!==x.total);$('#view').innerHTML=`<div class="card"><h2>Live Results</h2><div class="sub">Stage Pointsは同一Division内の最高HFを基準に計算。複数Division混在時の「全体順位」は参考表示です。</div></div><div class="card"><div class="topbar"><div><h3 style="margin:0">暫定ランキング</h3><div class="sub">${pr.stages.length?`集計対象: ${esc(prLabel)} · 全参加者完了 ${pr.stages.length}/${m.stages.length} Stages`:'全員完了Stageなし'}</div></div><div class="spacer"></div><button class="btn small" onclick="showProvisionalRanking()">詳細</button></div>${pr.stages.length?`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Rank / Shooter</th><th>Division</th><th>Points</th></tr></thead><tbody>${pr.rows.map((x,i)=>`<tr><td class="rank${i<3?i+1:''}">#${i+1} ${esc(x.s.name)}</td><td>${esc(x.s.division)}</td><td>${fmt2(x.pts)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">全員完了Stageなし</div>'}</div><div class="card"><h3>Overall</h3><div class="tablewrap"><table><thead><tr><th>Rank / Shooter</th><th>Division</th><th>Progress</th><th>Points</th><th>% max</th></tr></thead><tbody>${complete.map((x,i)=>resultTr(x,i+1,m)).join('')||'<tr><td colspan="5">Complete shooterなし</td></tr>'}</tbody></table></div>${progress.length?`<h3 style="margin-top:16px">In progress</h3><div class="tablewrap"><table><thead><tr><th>Shooter</th><th>Division</th><th>Progress</th><th>Current pts</th><th>—</th></tr></thead><tbody>${progress.map(x=>`<tr><td>${esc(x.s.name)}</td><td>${esc(x.s.division)}</td><td>${x.done}/${x.total}</td><td>${fmt2(x.pts)}</td><td>—</td></tr>`).join('')}</tbody></table></div>`:''}</div><div class="card"><h3>Stage statistics</h3><div class="tablewrap"><table><thead><tr><th>Stage</th><th>Max HF</th><th>Avg HF</th><th>Median HF</th><th>Scored</th></tr></thead><tbody>${m.stages.map(st=>{const x=stageStats(m,st);return `<tr><td>${esc(st.name)}</td><td>${fmt(x.max)}</td><td>${fmt(x.avg)}</td><td>${fmt(x.med)}</td><td>${x.count}/${m.shooters.length}</td></tr>`}).join('')}</tbody></table></div></div>`}
function resultTr(x,rank,m){const max=m.stages.reduce((a,s)=>a+(+s.maxPoints||0),0),pc=max?x.pts/max*100:0;return `<tr><td class="rank${rank<=3?rank:''}">#${rank} ${esc(x.s.name)}</td><td>${esc(x.s.division)}</td><td>${x.done}/${x.total}</td><td>${fmt2(x.pts)}</td><td>${pc.toFixed(2)}%</td></tr>`}
function renderBackup(){const m=match();$('#view').innerHTML=`<div class="card"><h2>Backup / Export</h2><div class="sub">端末内の通常保存はIndexedDB。ここから大会単位のZIPを別ファイルとして保存できます。</div></div><div class="card"><button class="btn primary full" onclick="exportZip()">⇩ Match Backup ZIP</button><div style="height:8px"></div><button class="btn full" onclick="exportCsv()">⇩ Results CSV</button><hr><div class="note">ZIP構造: <b>${esc(safeName(m.date+'_'+m.name))}/Shooter/Stage/Attempt/score_v*.json + photos</b><br>iPhone/Safari等では、ブラウザの制限により任意フォルダへ自動追記せず、ZIPとしてFilesへ保存する方式です。</div></div>`}
function safeName(s){return String(s||'').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80)||'untitled'}
function csvEsc(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function buildCsv(m){const rule=getRule(m),zoneHeaders=(rule.zones||[]).map(z=>z.label),rows=[['Rule','Shooter','Nickname','Division','PF','Stage','Attempt rule','Official HF','Stage Points','Stage Max','Stage Rank','Time',...zoneHeaders,'Miss','NS','Procedural','Raw Pts','Penalty Pts','Total Pts']];for(const st of m.stages){const ranked=m.shooters.map(s=>({s,r:officialResult(m,s,st)})).filter(x=>x.r).sort((a,b)=>b.r.hf-a.r.hf);for(const s of m.shooters){const r=officialResult(m,s,st),p=stagePoints(m,s,st),rank=r?ranked.findIndex(x=>x.s.id===s.id)+1:'';let v=null;if(r?.attempt&&!r.attempt.average)v=latestVersion(r.attempt);rows.push([rule.name,s.name,s.nickname||'',s.division,s.pf,st.name,ruleName(st.rule),r?fmt(r.hf):'',p!==null?fmt2(p):'',st.maxPoints,rank,v?.time??'',...(rule.zones||[]).map(z=>v?zoneCount(v,z.key):''),v?.m??'',v?.ns??'',v?.proc??'',r?.raw??'',r?.penalties??'',r?.total??''])}}return rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportCsv(){const m=match();downloadBlob(new Blob(['\ufeff'+buildCsv(m)],{type:'text/csv;charset=utf-8'}),safeName(m.date+'_'+m.name)+'_results.csv')}
// Minimal ZIP writer (STORE method, no compression) so this HTML stays dependency-free/offline.
const crcTable=(()=>{let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xffffffff;for(let i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
async function zipStore(files){const enc=new TextEncoder();let parts=[],centrals=[],offset=0;for(const f of files){const name=enc.encode(f.name),data=f.data instanceof Uint8Array?f.data:new Uint8Array(await f.data.arrayBuffer()),crc=crc32(data);const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);parts.push(local,data);const cen=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]);centrals.push(cen);offset+=local.length+data.length}const centralSize=centrals.reduce((a,b)=>a+b.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);return new Blob([...parts,...centrals,end],{type:'application/zip'})}
async function exportZip(){const m=match(),enc=new TextEncoder(),root=safeName(m.date+'_'+m.name)+'/',files=[];files.push({name:root+'match.json',data:enc.encode(JSON.stringify({...m,exportedAt:new Date().toISOString(),appVersion:APP_VERSION},null,2))});files.push({name:root+'results.csv',data:enc.encode('\ufeff'+buildCsv(m))});for(const s of m.shooters){for(const st of m.stages){const sc=getScore(m,s.id,st.id);if(!sc)continue;for(let ai=0;ai<sc.attempts.length;ai++){const a=sc.attempts[ai],base=root+safeName(s.name)+'/'+safeName(st.name)+'/Attempt_'+String(ai+1).padStart(2,'0')+'/';for(const v of a.versions)files.push({name:base+'score_v'+v.v+'.json',data:enc.encode(JSON.stringify({shooter:s,stage:st,attemptStatus:a.status,version:v,computed:calcVersion(v,s.pf)},null,2))});for(const pid of a.photoIds||[]){const p=await idbGet('photos',pid);if(p)files.push({name:base+p.name,data:p.blob})}}}}toast('ZIPを作成中…');const zip=await zipStore(files);downloadBlob(zip,safeName(m.date+'_'+m.name)+'.zip');toast('Backup ZIPを作成しました')}
function updateHeaderRule(){const b=document.querySelector('.rulebrand'),m=match();if(b)b.textContent=m?getRule(m).name:'USPSA'}
function openRuleSettings(){const m=match();if(!m)return toast('Matchを開いてから変更してください');const r=getRule(m);showModal(`<div class="sheethead"><h3>Scoring Rule</h3><button class="btn small" onclick="closeModal()">閉じる</button></div><div class="note yellow"><b>注意:</b> ルールや配点を変更すると、既に保存済みのスコア、HF、Stage Points、順位が再換算され、結果が変わる可能性があります。</div><div class="grid" style="margin-top:12px"><button class="btn ${r.type==='USPSA'?'primary':''}" onclick="previewRule('USPSA')">USPSA</button><button class="btn ${r.type==='PCSL'?'primary':''}" onclick="previewRule('PCSL')">PCSL</button><button class="btn ${r.type==='CUSTOM'?'primary':''}" onclick="previewRule('CUSTOM')">Custom / Original</button><div id="ruleEditor"></div></div>`);previewRule(r.type||'USPSA',true)}
function previewRule(type,keepCurrent=false){const m=match(),base=(keepCurrent&&getRule(m).type===type)?JSON.parse(JSON.stringify(getRule(m))):defaultRuleProfile(type);const ed=$('#ruleEditor');if(!ed)return;window.__pendingRule=base;ed.innerHTML=ruleEditorHtml(base);applyLanguage(ed)}
function ruleEditorHtml(r){const zones=(r.zones||[]).map((z,i)=>`<div class="row"><div class="main"><div class="grid grid3"><div class="field"><label>Zone label</label><input id="rzLabel${i}" value="${esc(z.label)}"></div><div class="field"><label>Minor / Standard</label><input id="rzMin${i}" type="number" step="0.1" value="${z.minor}"></div><div class="field"><label>Major</label><input id="rzMaj${i}" type="number" step="0.1" value="${z.major}"></div></div></div>${r.type==='CUSTOM'?`<button class="btn danger small" onclick="removeRuleZone(${i})">×</button>`:''}</div>`).join('');return `<div class="card"><div class="field"><label>Rule name</label><input id="ruleName" value="${esc(r.name)}" ${r.type!=='CUSTOM'?'readonly':''}></div><h3 style="margin-top:14px">Scoring zones</h3><div class="list">${zones}</div>${r.type==='CUSTOM'?'<button class="btn full" style="margin-top:8px" onclick="addRuleZone()">＋ Zone追加</button>':''}<div class="grid grid3" style="margin-top:12px"><div class="field"><label>Miss penalty</label><input id="rMiss" type="number" min="0" step="0.1" value="${r.miss}"></div><div class="field"><label>No-Shoot penalty</label><input id="rNS" type="number" min="0" step="0.1" value="${r.noShoot}"></div><div class="field"><label>Procedural penalty</label><input id="rPR" type="number" min="0" step="0.1" value="${r.procedural}"></div></div><div class="field" style="margin-top:10px"><label><input id="rUsePF" type="checkbox" ${r.usePF?'checked':''}> Major / Minorで配点を分ける</label></div><button class="btn primary full" style="margin-top:12px" onclick="confirmRuleChange()">確認して変更</button></div>`}
function readRuleEditor(){const r=window.__pendingRule||defaultRuleProfile('CUSTOM');r.name=$('#ruleName')?.value.trim()||r.name;r.miss=Math.max(0,+$('#rMiss')?.value||0);r.noShoot=Math.max(0,+$('#rNS')?.value||0);r.procedural=Math.max(0,+$('#rPR')?.value||0);r.usePF=!!$('#rUsePF')?.checked;r.zones=(r.zones||[]).map((z,i)=>({...z,label:$('#rzLabel'+i)?.value.trim()||z.label,minor:+$('#rzMin'+i)?.value||0,major:+$('#rzMaj'+i)?.value||0}));return r}
function addRuleZone(){let r=readRuleEditor();const i=r.zones.length+1;r.zones.push({key:'Z'+i+'_'+Date.now().toString(36),label:'Zone '+i,minor:0,major:0});window.__pendingRule=r;$('#ruleEditor').innerHTML=ruleEditorHtml(r);applyLanguage($('#ruleEditor'))}
function removeRuleZone(i){let r=readRuleEditor();r.zones.splice(i,1);window.__pendingRule=r;$('#ruleEditor').innerHTML=ruleEditorHtml(r);applyLanguage($('#ruleEditor'))}
function confirmRuleChange(){const r=readRuleEditor();showModal(`<div class="sheethead"><h3>ルール変更の確認</h3></div><div class="note"><b>${esc(getRule(match()).name)} → ${esc(r.name)}</b><br><br>ルール変更により、保存済みのスコア換算、Hit Factor、Stage Points、順位が異なる結果になる可能性があります。変更を許可しますか？</div><div class="grid grid2" style="margin-top:14px"><button class="btn" onclick="openRuleSettings()">キャンセル</button><button class="btn primary" onclick="applyRuleChange()">変更を許可</button></div>`);window.__pendingRule=r}
async function applyRuleChange(){const m=match();m.ruleProfile=window.__pendingRule||defaultRuleProfile('USPSA');m.ruleHistory=m.ruleHistory||[];m.ruleHistory.push({changedAt:new Date().toISOString(),rule:JSON.parse(JSON.stringify(m.ruleProfile))});await save();closeModal();render();toast('Scoring Ruleを変更しました')}
function openAbout(){const r=match()?getRule(match()):defaultRuleProfile('USPSA');showModal(`<div class="sheethead"><h3>Match Scorer v${APP_VERSION}</h3><button class="btn small" onclick="closeModal()">閉じる</button></div><div class="note">Local-first HTML prototype。通常データと写真はブラウザのIndexedDBに保存します。<br><br><b>Current Rule: ${esc(r.name)}</b><br>右上のルール名を押すと USPSA / PCSL / Custom を切り替えられます。Customではゾーン名・配点・Penaltyを編集できます。<br><br><b>注意</b><br>ルール変更は既存データを削除しませんが、保存済みのHit Factor、Stage Points、順位は新しい配点で再計算されるため結果が変わる可能性があります。正式なMatchでは、その競技団体の現行ルールとWritten Stage Briefingを優先してください。</div>`)}
(async()=>{try{await openDB();state=(await idbGet('kv','state'))||state;state.language=state.language==='en'?'en':'ja';if(state.activeMatchId&&!state.matches.some(m=>m.id===state.activeMatchId))state.activeMatchId=null;render();applyLanguage(document)}catch(e){console.error(e);document.getElementById('view').innerHTML='<div class="card"><h2>Storage error</h2><div class="note">IndexedDBを使用できません。Safari/Chromeの通常タブで開いてください。</div></div>';applyLanguage(document)}})();
</script>
</body>
</html>
